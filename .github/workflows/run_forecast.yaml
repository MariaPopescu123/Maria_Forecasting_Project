on:
  #schedule:
   # - cron: '0 15 * * *' ## UNCOMMENT THIS WHEN READY FOR AUTOMATION
  workflow_dispatch:


name: fCMdepth_mp ## POPULATE THIS WITH YOUR MODEL ID

jobs:
  docker:
    runs-on: ubuntu-latest
    container: rqthomas/vera-rocker:latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Install
        shell: Rscript {0}
        run: |
          install.packages(c("tidyverse", "arrow", "randomForest", "lubridate","zoo","rLakeAnalyzer")) ## POPULATE THIS WITH ANY SPECIFIC PACKAGES YOU NEED
          remotes::install_github("LTREB-reservoirs/vera4castHelpers")
          
      - name: Generate forecasts
        shell: Rscript {0}
        run: |
          source("Submit_forecast/mp_CMdepth_Forecast.R")
          
    
